name: APK Giacenze
on:
  push:
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Compila APK
        env: { VERSION_CODE: '${{ github.run_number }}' }
        run: gradle -p android :app:assembleRelease --no-daemon
      - name: Pubblica nella release "apk"
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk GiacenzeTubolari.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "App Giacenze Tubolari" --notes "App Android di sola consultazione delle giacenze."
          gh release upload apk GiacenzeTubolari.apk --clobber
          gh release edit apk --notes "App Android di sola consultazione delle giacenze. Versione 1.${{ github.run_number }} del $(date +%d/%m/%Y)."
